name: CI/CD Pipeline

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.21
    - name: Run tests
      run: |
        go test -v -race ./...
        go vet ./...
        staticcheck ./...
        go test ./internal/realtime
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/events

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build Docker image
      run: docker build -t messaging-app:latest .
    - name: Build Events Docker image
      run: docker build -f Dockerfile.events -t messaging-events-service:latest .
    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    - name: Push Docker image
      run: |
        docker tag messaging-app:latest ${{ secrets.DOCKER_HUB_USERNAME }}/messaging-app:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/messaging-app:latest
        docker tag messaging-events-service:latest ${{ secrets.DOCKER_HUB_USERNAME }}/messaging-events-service:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/messaging-events-service:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install kubectl
      uses: azure/setup-kubectl@v1
    - name: Deploy to Kubernetes
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml
        ./scripts/deploy.sh
